name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: mkdir -p artifacts && pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ui-container-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  deliver:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-ui-container-${{ github.sha }}
          path: artifacts
      - run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(artifacts/*.tgz)
          test "${#artifacts[@]}" -eq 1
          tar -tzf "${artifacts[0]}" >/dev/null
