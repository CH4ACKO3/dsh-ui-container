name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deliver:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: |
          set -euo pipefail
          test ! -e .npmrc
          trap 'rm -f .npmrc' EXIT
          printf '%s\n' \
            'proxy=http://127.0.0.1:1081' \
            'https-proxy=http://127.0.0.1:1081' > .npmrc
          pnpm install --frozen-lockfile
      - run: mkdir -p artifacts && pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ui-container-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
